[build-system]
requires = ["setuptools >= 84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[project]
name = "project_plutus"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.10,<3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]
license-files = ["LICEN[CS]E*", "*.license"]

[dependency-groups]
publish = ["discord.py == 2.3.2", "python-dotenv == 1.0.0"]
typing = ["mypy >= 2.3.1"]

[project.urls]
Homepage = "https://github.com/Vessel9817/project-plutus"
Issues = "https://github.com/Vessel9817/project-plutus/issues"
